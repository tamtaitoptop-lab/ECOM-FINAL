<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOM DIGITAL — Quản lý kinh doanh thương mại điện tử</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/lucide@0.395.0/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-0:#050816; --bg-1:#080B1F; --bg-2:#10142B; --bg-3:#161B36;
  --card:rgba(255,255,255,0.035); --card-hover:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.09); --border-soft:rgba(255,255,255,0.05);
  --text:#E8E9F1; --muted:#8E93AC; --muted-2:#5D6285;
  --purple:#8B5CF6; --pink:#EC4899; --blue:#3B82F6;
  --green:#22C55E; --red:#F43F5E; --yellow:#F59E0B; --cyan:#22D3EE;
  --grad-1:linear-gradient(135deg,#8B5CF6,#EC4899);
  --grad-2:linear-gradient(135deg,#3B82F6,#8B5CF6);
  --grad-3:linear-gradient(135deg,#EC4899,#3B82F6);
  --radius:14px; --radius-sm:10px;
  --shadow:0 8px 30px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(139,92,246,0.16), transparent 60%),
    radial-gradient(1000px 600px at -10% 20%, rgba(236,72,153,0.10), transparent 55%),
    radial-gradient(900px 500px at 50% 110%, rgba(59,130,246,0.10), transparent 55%),
    var(--bg-0);
  color:var(--text);
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== LAYOUT ===== */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:258px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  border-right:1px solid var(--border-soft);position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;transition:width .2s ease;z-index:50;
}
.sidebar.collapsed{width:76px;}
.sb-logo{padding:22px 20px 16px;display:flex;align-items:center;gap:10px;}
.sb-logo-mark{width:38px;height:38px;border-radius:11px;background:var(--grad-1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;box-shadow:0 0 22px rgba(139,92,246,0.45);}
.sb-logo-text{line-height:1.1;overflow:hidden;white-space:nowrap;}
.sb-logo-text b{font-size:15px;letter-spacing:0.5px;background:var(--grad-1);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;}
.sb-logo-text span{font-size:9.5px;color:var(--muted-2);letter-spacing:1.4px;}
.sidebar.collapsed .sb-logo-text{display:none;}
.sb-nav{flex:1;padding:6px 12px 20px;overflow-y:auto;}
.sb-group-title{font-size:10.5px;color:var(--muted-2);letter-spacing:1px;margin:16px 10px 6px;font-weight:600;}
.sidebar.collapsed .sb-group-title{display:none;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:13.5px;margin-bottom:2px;border:1px solid transparent;white-space:nowrap;overflow:hidden;}
.sb-item svg{flex-shrink:0;width:17px;height:17px;}
.sb-item:hover{background:var(--card-hover);color:var(--text);}
.sb-item.active{background:linear-gradient(135deg,rgba(139,92,246,0.22),rgba(236,72,153,0.14));color:#fff;border-color:rgba(139,92,246,0.35);box-shadow:0 0 18px rgba(139,92,246,0.18) inset;}
.sidebar.collapsed .sb-item span.label{display:none;}
.sb-collapse-btn{margin:10px;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--border-soft);color:var(--muted);display:flex;align-items:center;justify-content:center;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(8,11,31,0.75);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);padding:12px 22px;display:flex;align-items:center;gap:16px;
}
.hamburger{display:none;background:var(--card);border:1px solid var(--border-soft);border-radius:10px;padding:8px;color:var(--text);}
.breadcrumb{font-size:12.5px;color:var(--muted);flex-shrink:0;}
.breadcrumb b{color:var(--text);font-weight:600;}
.search-box{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border-soft);border-radius:10px;padding:8px 12px;}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.search-box svg{color:var(--muted-2);width:16px;height:16px;flex-shrink:0;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.icon-btn{position:relative;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.icon-btn:hover{color:var(--text);background:var(--card-hover);}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 6px var(--pink);}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--grad-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

.content{padding:22px;max-width:1500px;width:100%;margin:0 auto;}
.page-title{font-size:20px;font-weight:700;margin:0 0 4px;}
.page-sub{color:var(--muted);font-size:12.5px;margin:0 0 18px;}

/* ===== CARD / GRID ===== */
.card{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.grid{display:grid;gap:14px;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:1100px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.kpi-card{padding:16px;position:relative;overflow:hidden;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kpi-icon svg{width:17px;height:17px;color:#fff;}
.kpi-title{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0.3px;}
.kpi-value{font-size:20px;font-weight:800;margin:2px 0 6px;}
.kpi-trend{font-size:11.5px;display:flex;align-items:center;gap:4px;}
.trend-up{color:var(--green);} .trend-down{color:var(--red);} .trend-flat{color:var(--muted);}

.section-title{font-size:14.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,0.02);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--grad-1);color:#fff;border-color:transparent;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.select, .input, .dateinput{background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 10px;font-size:12.5px;outline:none;}
.select:focus,.input:focus{border-color:var(--purple);}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12.5px;font-weight:600;}
.btn:hover{background:var(--card-hover);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--grad-1);border:none;color:#fff;box-shadow:0 4px 18px rgba(139,92,246,0.35);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-danger{background:rgba(244,63,94,0.12);border:1px solid rgba(244,63,94,0.35);color:#fca5b5;}
.btn-sm{padding:5px 9px;font-size:11.5px;}
.btn-icon{padding:7px;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border-soft);}
thead th{position:sticky;top:0;background:var(--bg-2);color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border);font-size:11.5px;}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
tbody tr:hover{background:rgba(255,255,255,0.02);}
.badge{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;display:inline-block;white-space:nowrap;}
.b-pending{background:rgba(245,158,11,0.15);color:var(--yellow);}
.b-confirmed{background:rgba(59,130,246,0.15);color:var(--blue);}
.b-shipping{background:rgba(34,211,238,0.15);color:var(--cyan);}
.b-success{background:rgba(34,197,94,0.15);color:var(--green);}
.b-return{background:rgba(244,63,94,0.15);color:var(--red);}
.b-cancelled{background:rgba(148,163,184,0.15);color:#94a3b8;}
.b-green{background:rgba(34,197,94,0.15);color:var(--green);}
.b-yellow{background:rgba(245,158,11,0.15);color:var(--yellow);}
.b-red{background:rgba(244,63,94,0.15);color:var(--red);}
.b-purple{background:rgba(139,92,246,0.18);color:#c4b5fd;}
.row-actions{display:flex;gap:6px;}
.row-actions button{background:var(--card);border:1px solid var(--border-soft);color:var(--muted);border-radius:7px;padding:5px;}
.row-actions button:hover{color:var(--text);background:var(--card-hover);}
.row-actions svg{width:14px;height:14px;display:block;}
.pagination{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--muted);}
.pagination button{background:var(--card);border:1px solid var(--border-soft);color:var(--text);border-radius:7px;padding:5px 10px;}
.pagination button:disabled{opacity:.35;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state svg{width:38px;height:38px;color:var(--muted-2);margin-bottom:10px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(2,4,14,0.65);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:inherit;z-index:2;}
.modal-header h3{margin:0;font-size:15px;}
.modal-body{padding:18px 20px;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:inherit;}
.close-x{background:transparent;border:none;color:var(--muted);}
.form-row{margin-bottom:13px;}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
.form-row .input,.form-row .select,.form-row textarea{width:100%;}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
textarea.input{resize:vertical;min-height:60px;}

/* toast */
#toast-wrap{position:fixed;top:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{padding:11px 16px;border-radius:11px;font-size:12.5px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:220px;animation:slidein .25s ease;border:1px solid rgba(255,255,255,0.12);}
@keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast.success{background:linear-gradient(135deg,#16a34a,#22c55e);}
.toast.error{background:linear-gradient(135deg,#dc2626,#f43f5e);}
.toast.warning{background:linear-gradient(135deg,#b45309,#f59e0b);}

.progress-outer{height:8px;border-radius:6px;background:rgba(255,255,255,0.06);overflow:hidden;}
.progress-inner{height:100%;border-radius:6px;background:var(--grad-1);}

.insight-box{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(236,72,153,0.05));display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.insight-box svg{width:16px;height:16px;color:#c4b5fd;flex-shrink:0;margin-top:2px;}
.insight-box p{margin:0;font-size:12.5px;color:#e5e7f5;line-height:1.5;}

.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{background:var(--card);border:1px solid var(--border-soft);border-radius:12px;min-width:230px;flex:0 0 230px;padding:10px;max-height:70vh;overflow-y:auto;}
.kanban-col h4{font-size:12px;margin:2px 4px 10px;color:var(--muted);display:flex;justify-content:space-between;}
.kanban-card{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:12px;}
.kanban-card:hover{border-color:var(--purple);}
.kanban-card b{display:block;font-size:12.5px;margin-bottom:3px;}
.kanban-card .kc-meta{color:var(--muted);font-size:11px;margin-top:4px;}
.kanban-col.dragover{outline:1.5px dashed var(--purple);}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border-soft);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:600;}
.tab-btn.active{background:var(--grad-2);color:#fff;border-color:transparent;}

.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
@media(max-width:1100px){.two-col{grid-template-columns:1fr;}}
.mini-bar{height:6px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;margin-top:4px;}
.mini-bar-fill{height:100%;border-radius:4px;}
hr.sep{border:none;border-top:1px solid var(--border-soft);margin:14px 0;}
.muted{color:var(--muted);}
.mono{font-variant-numeric:tabular-nums;}
.stat-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.stat-line:last-child{border-bottom:none;}
.notif-item{padding:10px;border-radius:10px;border:1px solid var(--border-soft);margin-bottom:8px;font-size:12px;display:flex;gap:8px;}
.notif-item svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
.hidden{display:none!important;}
.overlay-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:none;}
.overlay-bg.show{display:block;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-270px;top:0;height:100vh;z-index:100;transition:left .2s ease;width:258px!important;}
  .sidebar.mobile-open{left:0;}
  .hamburger{display:flex;}
  .search-box{display:none;}
  .grid-kpi{grid-template-columns:repeat(2,1fr);}
  .content{padding:14px;}
  .form-grid2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="toast-wrap"></div>
<div class="overlay-bg" id="overlayBg" onclick="closeMobileSidebar()"></div>
<div id="app"></div>

<script>
/* =========================================================
   ECOM DIGITAL — Ecommerce Business Management System
   Single-file app. State + calculations + storage + UI.
   ========================================================= */

/* ---------------- CONSTANTS ---------------- */
const LS_KEY = 'ecomDigitalData';
const ORDER_STATUSES = ['pending','confirmed','shipping','success','return','cancelled'];
const ORDER_STATUS_LABEL = {pending:'Chờ xử lý',confirmed:'Đã xác nhận',shipping:'Đang giao',success:'Thành công',return:'Hoàn',cancelled:'Hủy'};
const BOOKING_STATUSES = ['lead','contacted','responded','negotiating','confirmed','sent','received','posted','tracking','done','cancelled'];
const BOOKING_STATUS_LABEL = {lead:'Lead',contacted:'Đã liên hệ',responded:'Đã phản hồi',negotiating:'Đàm phán',confirmed:'Chốt booking',sent:'Đã gửi sản phẩm',received:'Đã nhận sản phẩm',posted:'Đã đăng',tracking:'Đang theo dõi',done:'Hoàn thành',cancelled:'Hủy'};
const KOC_STATUSES = ['potential','contacting','sent','received','producing','posted','running','paused','stopped'];
const KOC_STATUS_LABEL = {potential:'Tiềm năng',contacting:'Đang liên hệ',sent:'Đã gửi mẫu',received:'Đã nhận mẫu',producing:'Đang làm nội dung',posted:'Đã đăng',running:'Đang chạy',paused:'Tạm dừng',stopped:'Không hợp tác'};
const EXPENSE_TYPES = [
  {id:'platform_fee',name:'Phí sàn',variable:true},
  {id:'payment_fee',name:'Phí thanh toán',variable:true},
  {id:'shipping_fee',name:'Phí vận chuyển',variable:true},
  {id:'ads',name:'Phí quảng cáo',variable:true},
  {id:'koc_commission',name:'Hoa hồng KOC',variable:true},
  {id:'cogs',name:'Giá vốn',variable:true},
  {id:'import',name:'Chi phí nhập hàng',variable:true},
  {id:'packaging',name:'Chi phí đóng gói',variable:true},
  {id:'warehouse',name:'Chi phí kho',variable:false},
  {id:'staff',name:'Chi phí nhân sự',variable:false},
  {id:'software',name:'Chi phí phần mềm',variable:false},
  {id:'marketing_other',name:'Chi phí marketing',variable:true},
  {id:'other',name:'Chi phí khác',variable:false},
];
const ICONS = {
  dashboard:'layout-dashboard', orders:'shopping-cart', products:'package', revenue:'trending-up',
  refund:'rotate-ccw', inventory:'boxes', finance:'wallet', income:'arrow-down-circle',
  expense:'arrow-up-circle', cogs:'tag', profit:'piggy-bank', settlement:'scale', cashflow:'waves',
  debt:'file-text', koc:'users', kocgroup:'group', campaign:'megaphone', booking:'kanban',
  commission:'hand-coins', kocperf:'bar-chart-3', kocpay:'credit-card', marketing:'target',
  roas:'gauge', roi:'trending-up', cac:'user-plus', reports:'file-bar-chart', settings:'settings',
  bell:'bell', search:'search', menu:'menu', chevronLeft:'chevron-left', chevronRight:'chevron-right',
  plus:'plus', edit:'pencil', trash:'trash-2', eye:'eye', download:'download', upload:'upload',
  x:'x', check:'check', alert:'alert-triangle', info:'info', star:'sparkles', save:'save',
  business:'building-2', category:'tags', backup:'database', money:'banknote'
};
function icon(name,sz=17){ return `<i data-lucide="${ICONS[name]||name}" style="width:${sz}px;height:${sz}px"></i>`; }

/* ---------------- UTILITIES ---------------- */
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function formatCurrency(v){
  if(v===null||v===undefined||isNaN(v)) v=0;
  v = Math.round(v);
  return v.toLocaleString('vi-VN')+' ₫';
}
function formatNumber(v){ if(v===null||v===undefined||isNaN(v)) v=0; return Math.round(v).toLocaleString('vi-VN'); }
function formatPct(v){ if(v===null||v===undefined||isNaN(v)||!isFinite(v)) v=0; return v.toFixed(1)+'%'; }
function safeDiv(a,b){ if(!b) return 0; const r=a/b; return isFinite(r)?r:0; }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('vi-VN'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr,n){ const d=new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);} }

function toast(msg,type='success'){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2600);
}
function confirmAction(msg,onYes){
  openModal({
    title:'Xác nhận',
    bodyHtml:`<p style="font-size:13px;line-height:1.6">${escapeHtml(msg)}</p>`,
    footerHtml:`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn btn-danger" id="confirmYesBtn">Xác nhận</button>`,
  });

/* ================= SUPABASE SYNC =================
   ECOM DIGITAL lưu toàn bộ `state` dưới dạng 1 bản ghi JSONB duy nhất
   trong bảng `ecom_digital_data`, khóa chính là "Mã cửa hàng" (storeId).
   Nhờ vậy không cần đổi cấu trúc dữ liệu hiện có, chỉ cần đồng bộ
   JSON qua lại giữa localStorage (offline-first) và Supabase (cloud).
==================================================== */
const SUPABASE_CFG_KEY = 'ecomDigitalSupabaseConfig';
const SUPABASE_TABLE = 'ecom_digital_data';
let supabaseClient = null;
let supabaseStatus = 'disconnected'; // disconnected | connecting | connected | error
let supabaseStatusMsg = '';
let supabasePushTimer = null;
let supabaseSyncing = false;

const DEFAULT_SUPABASE_CONFIG = {
  url: 'https://pyqatxrtqmrepyagzpug.supabase.co',
  anonKey: 'sb_publishable_mw9FAd_US_PPW7Z9oBerFQ_HYl5ybx6',
  storeId: 'default',
  autoSync: true
};

function getSupabaseConfig(){
  try{
    const raw = localStorage.getItem(SUPABASE_CFG_KEY);
    return raw ? {...DEFAULT_SUPABASE_CONFIG, ...JSON.parse(raw)} : {...DEFAULT_SUPABASE_CONFIG};
  }catch(e){
    return {...DEFAULT_SUPABASE_CONFIG};
  }
}
function setSupabaseConfig(cfg){
  localStorage.setItem(SUPABASE_CFG_KEY, JSON.stringify(cfg));
}
function clearSupabaseConfig(){
  localStorage.removeItem(SUPABASE_CFG_KEY);
  supabaseClient = null;
  supabaseStatus = 'disconnected';
  supabaseStatusMsg = '';
}
function initSupabaseClient(){
  const cfg = getSupabaseConfig();
  if(!cfg || !cfg.url || !cfg.anonKey){ supabaseClient=null; supabaseStatus='disconnected'; return null; }
  try{
    supabaseClient = supabase.createClient(cfg.url, cfg.anonKey);
    return supabaseClient;
  }catch(e){
    supabaseClient = null; supabaseStatus='error'; supabaseStatusMsg = e.message;
    return null;
  }
}
function ensureSupabaseClient(){
  if(supabaseClient) return supabaseClient;
  return initSupabaseClient();
}
async function testSupabaseConnection(){
  const cfg = getSupabaseConfig();
  if(!cfg){ supabaseStatus='disconnected'; return; }
  const client = ensureSupabaseClient();
  if(!client){ supabaseStatus='error'; supabaseStatusMsg='Không khởi tạo được kết nối'; return; }
  supabaseStatus = 'connecting';
  try{
    const { error } = await client.from(SUPABASE_TABLE).select('id').eq('id', cfg.storeId||'default').limit(1);
    if(error) throw error;
    supabaseStatus = 'connected'; supabaseStatusMsg='';
  }catch(e){
    supabaseStatus = 'error';
    supabaseStatusMsg = e.message || 'Không thể kết nối tới Supabase';
  }
}
function scheduleSupabasePush(){
  const cfg = getSupabaseConfig();
  if(!cfg || !cfg.autoSync) return;
  clearTimeout(supabasePushTimer);
  supabasePushTimer = setTimeout(()=>{ pushStateToSupabase(true); }, 1500);
}
async function pushStateToSupabase(silent){
  const cfg = getSupabaseConfig();
  if(!cfg){ if(!silent) toast('Chưa cấu hình Supabase','warning'); return; }
  const client = ensureSupabaseClient();
  if(!client){ if(!silent) toast('Không khởi tạo được kết nối Supabase','error'); return; }
  supabaseSyncing = true;
  try{
    const { error } = await client.from(SUPABASE_TABLE).upsert({
      id: cfg.storeId || 'default',
      data: state,
      updated_at: new Date().toISOString(),
    });
    if(error) throw error;
    supabaseStatus = 'connected'; supabaseStatusMsg='';
    if(!silent) toast('Đã đồng bộ dữ liệu lên Supabase thành công','success');
  }catch(e){
    supabaseStatus = 'error'; supabaseStatusMsg = e.message || 'Lỗi đồng bộ';
    if(!silent) toast('Lỗi đồng bộ Supabase: '+(e.message||''),'error');
  }
  supabaseSyncing = false;
  if(mainState.settings && mainState.settings.tab==='supabase') render();
}
async function pullStateFromSupabase(silent){
  const cfg = getSupabaseConfig();
  if(!cfg){ if(!silent) toast('Chưa cấu hình Supabase','warning'); return false; }
  const client = ensureSupabaseClient();
  if(!client){ if(!silent) toast('Không khởi tạo được kết nối Supabase','error'); return false; }
  supabaseSyncing = true;
  try{
    const { data, error } = await client.from(SUPABASE_TABLE).select('data').eq('id', cfg.storeId||'default').maybeSingle();
    if(error) throw error;
    supabaseStatus = 'connected'; supabaseStatusMsg='';
    supabaseSyncing = false;
    if(data && data.data){
      state = Object.assign(defaultState(), data.data);
      saveData();
      if(!silent) toast('Đã tải dữ liệu từ Supabase thành công','success');
      return true;
    } else {
      if(!silent) toast('Chưa có dữ liệu trên Supabase cho mã cửa hàng này','warning');
      return false;
    }
  }catch(e){
    supabaseSyncing = false;
    supabaseStatus = 'error'; supabaseStatusMsg = e.message || 'Lỗi tải dữ liệu';
    if(!silent) toast('Lỗi tải dữ liệu từ Supabase: '+(e.message||''),'error');
    return false;
  }
}

/* ---------------- CALCULATION ENGINE ---------------- */
function getPlatform(id){ return state.platforms.find(p=>p.id===id); }
function getProduct(id){ return state.products.find(p=>p.id===id); }
function getKoc(id){ return state.kocs.find(k=>k.id===id); }
function getCampaign(id){ return state.campaigns.find(c=>c.id===id); }
function getKocGroup(id){ return state.kocGroups.find(g=>g.id===id); }
function getEmployee(id){ return state.employees.find(e=>e.id===id); }

function kocCommissionPctFor(order){
  if(!order.kocId) return 0;
  const bk = state.bookings.find(b=>b.kocId===order.kocId && b.productId===order.productId);
  return bk ? bk.commissionPct : 10;
}

// Full computed financials for a single order (always computed, aggregation decides inclusion by status)
function calcOrder(order){
  const platform = getPlatform(order.platformId) || {paymentFeePct:0};
  const product = getProduct(order.productId) || {costPrice:0, platformFeePct:0, platformManagementFee:0};
  const grossRevenue = (order.sellPrice||0) * (order.qty||0);
  const netRevenue = Math.max(0, grossRevenue - (order.discount||0));
  const platformFee = netRevenue * (product.platformFeePct||0) / 100;
  const managementFee = (product.platformManagementFee||0) * (order.qty||0);
  const paymentFee = netRevenue * (platform.paymentFeePct||0) / 100;
  const kocPct = kocCommissionPctFor(order);
  const kocCommission = netRevenue * kocPct / 100;
  const adsCost = order.adsCostAllocated || 0;
  const shippingFee = order.shippingFeeSeller || 0;
  const netReceived = netRevenue - platformFee - managementFee - paymentFee - shippingFee;
  const cogs = (product.costPrice||0) * (order.qty||0);
  const grossProfit = netReceived - cogs;
  const netProfit = netReceived - cogs - kocCommission - adsCost;
  const margin = safeDiv(netProfit, netRevenue) * 100;
  return {grossRevenue,netRevenue,platformFee,managementFee,paymentFee,kocCommission,adsCost,shippingFee,netReceived,cogs,grossProfit,netProfit,margin};
}
function isCounted(order){ return order.status==='success'; }

function filterOrders(orders, f){
  f = f||{};
  return orders.filter(o=>{
    if(f.dateFrom && o.date < f.dateFrom) return false;
    if(f.dateTo && o.date > f.dateTo) return false;
    if(f.platformId && f.platformId!=='all' && o.platformId!==f.platformId) return false;
    if(f.productId && o.productId!==f.productId) return false;
    if(f.kocId && o.kocId!==f.kocId) return false;
    if(f.kocGroupId){ const k=getKoc(o.kocId); if(!k || k.groupId!==f.kocGroupId) return false; }
    if(f.campaignId && o.campaignId!==f.campaignId) return false;
    if(f.status && f.status!=='all' && o.status!==f.status) return false;
    if(f.search){
      const s=f.search.toLowerCase();
      const prod=getProduct(o.productId);
      const hay=(o.code+' '+o.customer+' '+o.sku+' '+(prod?prod.name:'')).toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}
function filterExpenses(expenses,f){
  f=f||{};
  return expenses.filter(e=>{
    if(f.dateFrom && e.date<f.dateFrom) return false;
    if(f.dateTo && e.date>f.dateTo) return false;
    if(f.platformId && f.platformId!=='all' && e.platformId && e.platformId!==f.platformId) return false;
    return true;
  });
}

function dateRangeFor(preset){
  const today = todayISO();
  switch(preset){
    case 'today': return {from:today,to:today};
    case '7d': return {from:addDays(today,-6),to:today};
    case '30d': return {from:addDays(today,-29),to:today};
    case 'this_month':{ const d=new Date(); return {from:new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10), to:today}; }
    case 'last_month':{ const d=new Date(); const first=new Date(d.getFullYear(),d.getMonth()-1,1); const last=new Date(d.getFullYear(),d.getMonth(),0); return {from:first.toISOString().slice(0,10), to:last.toISOString().slice(0,10)}; }
    case 'this_quarter':{ const d=new Date(); const q=Math.floor(d.getMonth()/3); const first=new Date(d.getFullYear(),q*3,1); return {from:first.toISOString().slice(0,10), to:today}; }
    case 'this_year':{ const d=new Date(); return {from:new Date(d.getFullYear(),0,1).toISOString().slice(0,10), to:today}; }
    default: return {from:addDays(today,-29),to:today};
  }
}
function prevRange(from,to){
  const span = daysBetween(from,to)+1;
  return {from:addDays(from,-span), to:addDays(from,-1)};
}

function aggregateOrders(orders){
  let grossRevenue=0,netRevenue=0,cogs=0,platformFee=0,managementFee=0,paymentFee=0,kocCommission=0,adsCost=0,shippingFee=0,netReceived=0,netProfit=0,grossProfit=0;
  let totalOrders=orders.length, successOrders=0, returnOrders=0, cancelOrders=0;
  orders.forEach(o=>{
    if(o.status==='return') returnOrders++;
    if(o.status==='cancelled') cancelOrders++;
    if(isCounted(o)){
      successOrders++;
      const c=calcOrder(o);
      grossRevenue+=c.grossRevenue; netRevenue+=c.netRevenue; cogs+=c.cogs; platformFee+=c.platformFee; managementFee+=c.managementFee;
      paymentFee+=c.paymentFee; kocCommission+=c.kocCommission; adsCost+=c.adsCost; shippingFee+=c.shippingFee;
      netReceived+=c.netReceived; grossProfit+=c.grossProfit; netProfit+=c.netProfit;
    }
  });
  return {grossRevenue,netRevenue,cogs,platformFee,managementFee,paymentFee,kocCommission,adsCost,shippingFee,netReceived,grossProfit,netProfit,
    totalOrders,successOrders,returnOrders,cancelOrders, margin: safeDiv(netProfit,netRevenue)*100};
}

function computeDashboard(filters){
  const orders = filterOrders(state.orders, filters);
  const cur = aggregateOrders(orders);
  const pr = prevRange(filters.dateFrom, filters.dateTo);
  const prevOrders = filterOrders(state.orders, Object.assign({},filters,{dateFrom:pr.from,dateTo:pr.to}));
  const prev = aggregateOrders(prevOrders);

  const expenses = filterExpenses(state.expenses, filters);
  const fixedCost = expenses.filter(e=>!e.isVariable).reduce((s,e)=>s+e.amount,0);
  const otherVarCost = expenses.filter(e=>e.isVariable).reduce((s,e)=>s+e.amount,0);
  const totalCost = cur.cogs + cur.platformFee + cur.managementFee + cur.paymentFee + cur.kocCommission + cur.adsCost + cur.shippingFee + fixedCost + otherVarCost;
  const netProfitFinal = cur.netProfit - fixedCost - otherVarCost;

  const adsSpend = state.ads.filter(a=>a.date>=filters.dateFrom && a.date<=filters.dateTo && (filters.platformId==='all'||!filters.platformId||a.platformId===filters.platformId)).reduce((s,a)=>s+a.cost,0);
  const adsRevenue = state.ads.filter(a=>a.date>=filters.dateFrom && a.date<=filters.dateTo && (filters.platformId==='all'||!filters.platformId||a.platformId===filters.platformId)).reduce((s,a)=>s+a.revenue,0);
  const roas = safeDiv(adsRevenue, adsSpend + cur.adsCost);
  const roi = safeDiv(netProfitFinal, totalCost)*100;

  function pctChange(c,p){ if(!p) return c>0?100:0; return safeDiv(c-p,p)*100; }

  return {
    orders, cur, prev, fixedCost, otherVarCost, totalCost, netProfitFinal, roas, roi,
    kpis:[
      {key:'grossRevenue', title:'Tổng doanh thu', value:cur.grossRevenue, change:pctChange(cur.grossRevenue,prev.grossRevenue), icon:'revenue', grad:'var(--grad-1)'},
      {key:'netReceived', title:'Doanh thu thực nhận', value:cur.netReceived, change:pctChange(cur.netReceived,prev.netReceived), icon:'income', grad:'var(--grad-2)'},
      {key:'totalOrders', title:'Tổng đơn hàng', value:cur.totalOrders, change:pctChange(cur.totalOrders,prev.totalOrders), icon:'orders', grad:'var(--grad-3)', isCount:true},
      {key:'successOrders', title:'Đơn thành công', value:cur.successOrders, change:pctChange(cur.successOrders,prev.successOrders), icon:'check', grad:'var(--grad-1)', isCount:true},
      {key:'returnOrders', title:'Đơn hoàn', value:cur.returnOrders, change:pctChange(cur.returnOrders,prev.returnOrders), icon:'refund', grad:'var(--grad-3)', isCount:true, invert:true},
      {key:'cancelOrders', title:'Đơn hủy', value:cur.cancelOrders, change:pctChange(cur.cancelOrders,prev.cancelOrders), icon:'x', grad:'var(--grad-3)', isCount:true, invert:true},
      {key:'cogs', title:'Giá vốn hàng bán', value:cur.cogs, change:pctChange(cur.cogs,prev.cogs), icon:'cogs', grad:'var(--grad-2)', invert:true},
      {key:'totalCost', title:'Tổng chi phí', value:totalCost, change:0, icon:'expense', grad:'var(--grad-2)', invert:true},
      {key:'adsCost', title:'Chi phí quảng cáo', value:adsSpend+cur.adsCost, change:0, icon:'marketing', grad:'var(--grad-3)', invert:true},
      {key:'kocCommission', title:'Hoa hồng KOC', value:cur.kocCommission, change:0, icon:'koc', grad:'var(--grad-1)', invert:true},
      {key:'platformFee', title:'Phí sàn', value:cur.platformFee, change:0, icon:'settlement', grad:'var(--grad-2)', invert:true},
      {key:'managementFee', title:'Phí quản lý sàn', value:cur.managementFee, change:0, icon:'settlement', grad:'var(--grad-2)', invert:true},
      {key:'grossProfit', title:'Lợi nhuận gộp', value:cur.grossProfit, change:pctChange(cur.grossProfit,prev.grossProfit), icon:'profit', grad:'var(--grad-1)'},
      {key:'netProfitFinal', title:'Lợi nhuận ròng', value:netProfitFinal, change:pctChange(netProfitFinal, prev.netProfit-fixedCost-otherVarCost), icon:'profit', grad:'var(--grad-1)'},
      {key:'margin', title:'Biên lợi nhuận', value:safeDiv(netProfitFinal,cur.netRevenue)*100, change:0, icon:'gauge', grad:'var(--grad-2)', isPct:true},
      {key:'roas', title:'ROAS', value:roas, change:0, icon:'roas', grad:'var(--grad-3)', isRatio:true},
      {key:'roi', title:'ROI', value:roi, change:0, icon:'roi', grad:'var(--grad-1)', isPct:true},
    ]
  };
}

function computeProductMetrics(filters){
  const orders = filterOrders(state.orders, filters);
  return state.products.map(p=>{
    const po = orders.filter(o=>o.productId===p.id && isCounted(o));
    let revenue=0,cogs=0,profit=0,qty=0,platformFee=0,kocCost=0,adsCost=0;
    po.forEach(o=>{ const c=calcOrder(o); revenue+=c.netRevenue; cogs+=c.cogs; profit+=c.netProfit; qty+=o.qty; platformFee+=c.platformFee+c.paymentFee; kocCost+=c.kocCommission; adsCost+=c.adsCost; });
    const margin = safeDiv(profit,revenue)*100;
    return {product:p, revenue, cogs, profit, qty, platformFee, kocCost, adsCost, margin};
  });
}

function computeKocMetrics(filters){
  const orders = filterOrders(state.orders, filters);
  return state.kocs.map(k=>{
    const ko = orders.filter(o=>o.kocId===k.id && isCounted(o));
    let revenue=0,commission=0;
    ko.forEach(o=>{ const c=calcOrder(o); revenue+=c.netRevenue; commission+=c.kocCommission; });
    const bks = state.bookings.filter(b=>b.kocId===k.id);
    const bookingCost = bks.reduce((s,b)=>s+(b.priceBooking||0),0);
    const sampleCost = bks.length * 150000; // simplified sample cost estimate
    const otherCost = state.expenses.filter(e=>e.kocId===k.id).reduce((s,e)=>s+e.amount,0);
    const totalCost = commission + bookingCost + sampleCost + otherCost;
    const profit = revenue - totalCost;
    const roas = safeDiv(revenue, totalCost);
    const roi = safeDiv(profit, totalCost)*100;
    const orderCount = ko.length;
    const cpa = safeDiv(totalCost, orderCount);
    const aov = safeDiv(revenue, orderCount);
    return {koc:k, revenue, commission, bookingCost, sampleCost, otherCost, totalCost, profit, roas, roi, orderCount, cpa, aov};
  });
}

function computeKocScore(kocMetricsList){
  const w = state.settings.kocScoring;
  const maxRevenue = Math.max(1,...kocMetricsList.map(m=>m.revenue));
  const maxOrders = Math.max(1,...kocMetricsList.map(m=>m.orderCount));
  const maxRoas = Math.max(0.001,...kocMetricsList.map(m=>m.roas));
  const maxRoi = Math.max(0.001,...kocMetricsList.map(m=>Math.max(0,m.roi)));
  const maxEng = Math.max(0.001,...kocMetricsList.map(m=>m.koc.engagement||0));
  return kocMetricsList.map(m=>{
    const revN = safeDiv(m.revenue,maxRevenue)*100;
    const ordN = safeDiv(m.orderCount,maxOrders)*100;
    const roasN = safeDiv(m.roas,maxRoas)*100;
    const roiN = safeDiv(Math.max(0,m.roi),maxRoi)*100;
    const engN = safeDiv(m.koc.engagement||0,maxEng)*100;
    const convN = ordN; // conversion proxy
    const score = (revN*w.revenue + ordN*w.orders + roasN*w.roas + roiN*w.roi + engN*w.engagement + convN*w.conversion)/100;
    let tier='Không hiệu quả', tierColor='b-red';
    if(score>=80){tier='Xuất sắc';tierColor='b-green';}
    else if(score>=65){tier='Tốt';tierColor='b-green';}
    else if(score>=50){tier='Trung bình';tierColor='b-yellow';}
    else if(score>=30){tier='Yếu';tierColor='b-yellow';}
    else {tier='Không hiệu quả'; tierColor='b-red';}
    return Object.assign({},m,{score:Math.round(score),tier,tierColor});
  });
}

function computeCampaignMetrics(filters){
  const orders = filterOrders(state.orders, filters);
  return state.campaigns.map(camp=>{
    const co = orders.filter(o=>o.campaignId===camp.id && isCounted(o));
    let revenue=0,commission=0;
    co.forEach(o=>{ const c=calcOrder(o); revenue+=c.netRevenue; commission+=c.kocCommission; });
    const ads = state.ads.filter(a=>a.campaign===camp.id);
    const adsCost = ads.reduce((s,a)=>s+a.cost,0);
    const adsRevenue = ads.reduce((s,a)=>s+a.revenue,0);
    const totalCost = commission + adsCost;
    const totalRevenue = revenue + adsRevenue;
    const profit = totalRevenue - totalCost;
    const roas = safeDiv(totalRevenue, totalCost);
    const roi = safeDiv(profit, totalCost)*100;
    const kocSet = new Set(co.map(o=>o.kocId).filter(Boolean));
    return {campaign:camp, revenue:totalRevenue, cost:totalCost, profit, roas, roi, orders:co.length+ads.reduce((s,a)=>s+a.orders,0), kocCount:kocSet.size, adsCost, adsRevenue};
  });
}

function computeSettlement(filters){
  return state.platforms.map(pl=>{
    const orders = filterOrders(state.orders, Object.assign({},filters,{platformId:pl.id}));
    const succ = orders.filter(isCounted);
    let revenue=0,platformFee=0,managementFee=0,paymentFee=0,shippingFee=0,netReceived=0;
    succ.forEach(o=>{ const c=calcOrder(o); revenue+=c.netRevenue; platformFee+=c.platformFee; managementFee+=c.managementFee; paymentFee+=c.paymentFee; shippingFee+=c.shippingFee; netReceived+=c.netReceived; });
    const returns = orders.filter(o=>o.status==='return').reduce((s,o)=>s+(o.sellPrice*o.qty-o.discount),0);
    const adjustment = 0;
    const shouldReceive = netReceived - returns + adjustment;
    const actualReceived = netReceived; // assume equal unless adjustments entered
    const diff = actualReceived - shouldReceive;
    return {platform:pl, revenue, platformFee, managementFee, paymentFee, shippingFee, returns, adjustment, shouldReceive, actualReceived, diff};
  });
}

function computeCashFlow(filters){
  const settlement = computeSettlement(filters);
  const cashIn = settlement.reduce((s,x)=>s+x.actualReceived,0);
  const expenses = filterExpenses(state.expenses, filters);
  const cashOutExpenses = expenses.reduce((s,e)=>s+e.amount,0);
  const orders = filterOrders(state.orders,filters).filter(isCounted);
  const cogsOut = orders.reduce((s,o)=>s+calcOrder(o).cogs,0);
  const kocOut = orders.reduce((s,o)=>s+calcOrder(o).kocCommission,0);
  const adsOut = orders.reduce((s,o)=>s+calcOrder(o).adsCost,0) + state.ads.filter(a=>a.date>=filters.dateFrom&&a.date<=filters.dateTo).reduce((s,a)=>s+a.cost,0);
  const cashOut = cashOutExpenses + cogsOut + kocOut + adsOut;
  const net = cashIn - cashOut;
  return {cashIn, cashOut, net, breakdown:{cogsOut,kocOut,adsOut,cashOutExpenses}};
}

  let cursor = range.from;
  while(cursor<=range.to && days.length<180){ days.push(cursor); cursor = addDays(cursor,1); }
  const revByDay = days.map(d=>{ const o=orders.filter(x=>x.date===d && isCounted(x)); return o.reduce((s,x)=>s+calcOrder(x).netRevenue,0); });
  const profitByDay = days.map(d=>{ const o=orders.filter(x=>x.date===d && isCounted(x)); return o.reduce((s,x)=>s+calcOrder(x).netProfit,0); });
  const costByDay = days.map(d=>{ const o=orders.filter(x=>x.date===d && isCounted(x)); return o.reduce((s,x)=>{const c=calcOrder(x); return s+c.cogs+c.platformFee+c.paymentFee+c.kocCommission+c.adsCost+c.shippingFee;},0); });
  const dayLabels = days.map(d=>d.slice(5));

  CHARTS.revProfit = new Chart(document.getElementById('chartRevenueProfit'), {
    type:'line', data:{labels:dayLabels, datasets:[
      {label:'Doanh thu', data:revByDay, borderColor:'#8B5CF6', backgroundColor:'rgba(139,92,246,0.12)', fill:true, tension:0.35, pointRadius:0},
      {label:'Lợi nhuận', data:profitByDay, borderColor:'#22C55E', backgroundColor:'rgba(34,197,94,0.08)', fill:true, tension:0.35, pointRadius:0},
    ]}, options:{responsive:true, plugins:{legend:{position:'bottom'}}, scales:{y:{ticks:{callback:v=>formatNumber(v)}}}}
  });
  CHARTS.revCost = new Chart(document.getElementById('chartRevenueCost'), {
    type:'bar', data:{labels:dayLabels, datasets:[
      {label:'Doanh thu', data:revByDay, backgroundColor:'#3B82F6'},
      {label:'Chi phí', data:costByDay, backgroundColor:'#EC4899'},
    ]}, options:{responsive:true, plugins:{legend:{position:'bottom'}}, scales:{y:{ticks:{callback:v=>formatNumber(v)}}}}
  });
  const byPlatform = state.platforms.map(p=>{ const o=orders.filter(x=>x.platformId===p.id&&isCounted(x)); return o.reduce((s,x)=>s+calcOrder(x).netRevenue,0); });
  CHARTS.platform = new Chart(document.getElementById('chartByPlatform'), {
    type:'doughnut', data:{labels:state.platforms.map(p=>p.name), datasets:[{data:byPlatform, backgroundColor:CHART_COLORS}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10}}}}
  });
  const succOrders = orders.filter(isCounted);
  let sumCogs=0,sumPlat=0,sumMgmt=0,sumPay=0,sumKoc=0,sumAds=0,sumShip=0;
  succOrders.forEach(o=>{ const c=calcOrder(o); sumCogs+=c.cogs; sumPlat+=c.platformFee; sumMgmt+=c.managementFee; sumPay+=c.paymentFee; sumKoc+=c.kocCommission; sumAds+=c.adsCost; sumShip+=c.shippingFee; });
  CHARTS.cost = new Chart(document.getElementById('chartCostStructure'), {
    type:'doughnut', data:{labels:['Giá vốn','Phí sàn','Phí quản lý sàn','Phí thanh toán','Hoa hồng KOC','Quảng cáo','Vận chuyển'], datasets:[{data:[sumCogs,sumPlat,sumMgmt,sumPay,sumKoc,sumAds,sumShip], backgroundColor:CHART_COLORS}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10}}}}
  });
  const statusCount = ORDER_STATUSES.map(st=>orders.filter(o=>o.status===st).length);
  CHARTS.status = new Chart(document.getElementById('chartOrderStatus'), {
    type:'pie', data:{labels:ORDER_STATUSES.map(s=>ORDER_STATUS_LABEL[s]), datasets:[{data:statusCount, backgroundColor:CHART_COLORS}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10}}}}
  });
  const pm = computeProductMetrics(filters).sort((a,b)=>b.revenue-a.revenue).slice(0,10);
  CHARTS.topProd = new Chart(document.getElementById('chartTopProducts'), {
    type:'bar', data:{labels:pm.map(p=>p.product.name.slice(0,14)), datasets:[{label:'Doanh thu', data:pm.map(p=>p.revenue), backgroundColor:'#8B5CF6'}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{callback:v=>formatNumber(v)}}}}
  });
  const km = computeKocMetrics(filters).sort((a,b)=>b.revenue-a.revenue).slice(0,10);
  CHARTS.topKoc = new Chart(document.getElementById('chartTopKoc'), {
    type:'bar', data:{labels:km.map(k=>k.koc.name.slice(0,14)), datasets:[{label:'Doanh thu', data:km.map(k=>k.revenue), backgroundColor:'#EC4899'}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{ticks:{callback:v=>formatNumber(v)}}}}
  });
  const groupRev = state.kocGroups.map(g=>{
    const kocIds = state.kocs.filter(k=>k.groupId===g.id).map(k=>k.id);
    const o = orders.filter(x=>kocIds.includes(x.kocId) && isCounted(x));
    return o.reduce((s,x)=>s+calcOrder(x).netRevenue,0);
  });
  CHARTS.kocGroup = new Chart(document.getElementById('chartKocGroup'), {
    type:'doughnut', data:{labels:state.kocGroups.map(g=>g.name), datasets:[{data:groupRev, backgroundColor:CHART_COLORS}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10}}}}
  });

  // Insight box
  const totalRev = revByDay.reduce((a,b)=>a+b,0);
  let insights = [];
  state.platforms.forEach((p,i)=>{ if(byPlatform[i] && totalRev>0){ const pct=safeDiv(byPlatform[i],totalRev)*100; if(pct>40) insights.push(`Doanh thu ${p.name} đang chiếm ${pct.toFixed(0)}% tổng doanh thu.`); } });
  const vipGroup = state.kocGroups.find(g=>g.name.includes('VIP'));
  if(vipGroup){
    const idx = state.kocGroups.indexOf(vipGroup);
    const totalKocRev = groupRev.reduce((a,b)=>a+b,0);
    if(totalKocRev>0 && groupRev[idx]) insights.push(`KOC nhóm ${vipGroup.name} đang tạo ra ${(safeDiv(groupRev[idx],totalKocRev)*100).toFixed(0)}% doanh thu KOC.`);
  }
  if(pm.length){ const best=pm[0]; insights.push(`Sản phẩm "${best.product.name}" có doanh thu cao nhất kỳ này (${formatCurrency(best.revenue)}).`); }
  const adsCostTotal = sumAds + state.ads.filter(a=>a.date>=range.from&&a.date<=range.to).reduce((s,a)=>s+a.cost,0);
  if(totalRev>0) insights.push(`Chi phí quảng cáo đang chiếm ${safeDiv(adsCostTotal,totalRev*100? totalRev: 1)>0? (safeDiv(adsCostTotal,totalRev)*100).toFixed(0):0}% doanh thu.`);
  const negRoiKoc = km.filter(k=>k.roi<0 && k.orderCount>0);
  if(negRoiKoc.length) insights.push(`${negRoiKoc.length} KOC có ROI âm trong kỳ này cần xem xét lại hợp tác.`);
  document.getElementById('insightBox').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="section-title">${icon('star',16)} &nbsp;ECOM DIGITAL INSIGHT</div>
      ${insights.length? insights.map(t=>`<div class="insight-box">${icon('info',15)}<p>${escapeHtml(t)}</p></div>`).join('') : `<div class="muted" style="font-size:12.5px">Chưa đủ dữ liệu để phân tích trong khoảng thời gian này.</div>`}
    </div>`;
};

function getOrderSourceName(id){

}

  <div class="table-wrap"><table>
    <thead><tr>

        <td style="text-align:center"><input type="checkbox" aria-label="Chọn phiếu ${escapeHtml(o.code)}" ${selectedSet.has(o.id)?'checked':''} onchange="toggleOrderSelection('${o.id}',this.checked)"></td>
        <td><b>${o.code}</b></td>
        <td>${fmtDate(o.date)}</td>

function emptyState(msg,onclickFn,btnLabel){
  return `<div class="card empty-state">${icon('info',30)}<div style="margin-bottom:14px">${msg}</div><button class="btn btn-primary" onclick="${onclickFn}">${btnLabel}</button></div>`;
}
function setOrderFilter(key,val){ if(key!=='page') mainState.orders.page=1; mainState.orders[key]=val; render(); }
function toggleOrderSelection(id,checked){
  const selected = new Set(mainState.orders.selected||[]);
  if(checked) selected.add(id); else selected.delete(id);
  mainState.orders.selected = [...selected];
  render();
}
function getCurrentOrderPageIds(){
  const s=mainState.orders;
  const filters={platformId:s.platformId==='all'?null:s.platformId,status:s.status,search:s.search};
  const list=filterOrders(state.orders,filters).sort((a,b)=>b.date.localeCompare(a.date));
  const totalPages=Math.max(1,Math.ceil(list.length/s.pageSize));
  s.page=Math.min(s.page,totalPages);
  return list.slice((s.page-1)*s.pageSize,s.page*s.pageSize).map(o=>o.id);
}
function toggleOrderSelectAll(checked){
  const selected=new Set(mainState.orders.selected||[]);
  getCurrentOrderPageIds().forEach(id=>checked?selected.add(id):selected.delete(id));
  mainState.orders.selected=[...selected];
  render();
}
function clearOrderSelection(){ mainState.orders.selected=[]; render(); }
function bulkUpdateOrderStatus(){
  const ids=mainState.orders.selected||[];
  if(!ids.length){ toast('Vui lòng chọn ít nhất một phiếu','warning'); return; }
  const status=document.getElementById('bulkOrderStatus')?.value;
  if(!status){ toast('Vui lòng chọn trạng thái cần chuyển','warning'); return; }
  state.orders.forEach(o=>{ if(ids.includes(o.id)) o.status=status; });
  mainState.orders.selected=[];
  saveData(); render();
  toast(`Đã chuyển trạng thái ${ids.length} phiếu sang ${ORDER_STATUS_LABEL[status]}`,'success');
}
function bulkDeleteOrders(){
  const ids=mainState.orders.selected||[];
  if(!ids.length){ toast('Vui lòng chọn ít nhất một phiếu','warning'); return; }
  confirmAction(`Xóa ${ids.length} mục doanh thu đã chọn? Dữ liệu liên quan sẽ được cập nhật lại.`, ()=>{
    const selected=new Set(ids);
    state.orders=state.orders.filter(o=>!selected.has(o.id));
    mainState.orders.selected=[];
    saveData(); render();
    toast(`Đã xóa ${ids.length} mục doanh thu`,'success');
  });
}

        <div class="form-row"><label>KOC (nếu có)</label><select class="select" name="kocId"><option value="">— Không có —</option>${state.kocs.map(k=>`<option value="${k.id}" ${o.kocId===k.id?'selected':''}>${escapeHtml(k.name)}</option>`).join('')}</select></div>
        <div class="form-row"><label>Chiến dịch</label><select class="select" name="campaignId"><option value="">— Không có —</option>${state.campaigns.map(c=>`<option value="${c.id}" ${o.campaignId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
        <div class="form-row"><label>Trạng thái *</label><select class="select" name="status">${ORDER_STATUSES.map(st=>`<option value="${st}" ${o.status===st?'selected':''}>${ORDER_STATUS_LABEL[st]}</option>`).join('')}</select></div>
      </div>
      <div class="form-row" id="refundReasonRow" style="${o.status==='return'?'':'display:none'}"><label>Lý do hoàn/hủy</label><input class="input" name="refundReason" value="${escapeHtml(o.refundReason||'')}"></div>
    </form>`,
    footerHtml:`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="submitOrderForm('${o.id||''}')">${icon('save',14)} Lưu</button>`
  });
  document.querySelector('select[name="status"]').addEventListener('change',function(){
    const show = this.value==='return';
    document.getElementById('refundReasonRow').style.display = show?'':'none';
  });
}
function onOrderProductChange(sel){
  const price = sel.options[sel.selectedIndex].getAttribute('data-price');
  document.querySelector('input[name="sellPrice"]').value = price;
}
function submitOrderForm(id){
  const form = document.getElementById('orderForm');
  const fd = new FormData(form);
  const code = fd.get('code').trim();
  if(!code){ toast('Vui lòng nhập mã đơn','error'); return; }
  const qty = parseInt(fd.get('qty'));
  const sellPrice = parseFloat(fd.get('sellPrice'));
  const discount = parseFloat(fd.get('discount')||0);
  if(qty<=0){ toast('Số lượng phải lớn hơn 0','error'); return; }
  if(sellPrice<0 || discount<0){ toast('Giá trị không được âm','error'); return; }
  if(discount > sellPrice*qty){ toast('Giảm giá không được lớn hơn tổng giá bán','error'); return; }
  const productId = fd.get('productId') || null;
  const product = productId ? getProduct(productId) : null;
  const data = {
    code, date: fd.get('date'), platformId: fd.get('platformId'), customer: fd.get('customer').trim(),
    productId, sku: product ? product.sku : '', qty, sellPrice, discount,
    shippingFeeSeller: parseFloat(fd.get('shippingFeeSeller')||0), adsCostAllocated: parseFloat(fd.get('adsCostAllocated')||0),
    kocId: fd.get('kocId')||null, campaignId: fd.get('campaignId')||null, status: fd.get('status'),
    refundReason: fd.get('refundReason')||'',
  };
  let orderObj;
  if(id){
    orderObj = state.orders.find(o=>o.id===id);
    Object.assign(orderObj, data);
  } else {
    orderObj = Object.assign({id:uid('ord')}, data);
    state.orders.push(orderObj);
  }
  saveData();
  closeModal();
  toast(id? 'Cập nhật doanh thu thành công':'Thêm doanh thu thành công','success');
  render();
}
function deleteOrder(id){
  confirmAction('Bạn có chắc muốn xóa mục doanh thu này? Dữ liệu liên quan sẽ được cập nhật lại.', ()=>{
    state.orders = state.orders.filter(o=>o.id!==id);
    saveData(); render();
    toast('Đã xóa','success');
  });
}
function viewOrder(id){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  const c = calcOrder(o); const p=getProduct(o.productId); const sourceName=getOrderSourceName(o.platformId); const koc=getKoc(o.kocId);
  openModal({title:'Chi tiết đơn '+o.code, bodyHtml:`
    <div class="stat-line"><span class="muted">Nguồn</span><b>${escapeHtml(sourceName)}</b></div>
    <div class="stat-line"><span class="muted">Khách hàng</span><b>${escapeHtml(o.customer)}</b></div>
    <div class="stat-line"><span class="muted">Sản phẩm</span><b>${p?escapeHtml(p.name):''}</b></div>
    <div class="stat-line"><span class="muted">KOC</span><b>${koc?escapeHtml(koc.name):'—'}</b></div>
    <hr class="sep">

function handleImportOrders(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      let added=0, errors=0;
      rows.forEach(r=>{
        const sku = String(r.SKU||r.sku||'').trim();
        const product = sku ? state.products.find(p=>p.sku===sku) : null;
        const sourceText = String(r['Nguồn']||r.Sàn||r.platform||'').trim();
        const source = sourceText==='Dịch vụ'
          ? {id:ORDER_SERVICE_SOURCE_ID}
          : (state.platforms.find(p=>p.name===sourceText) || state.platforms[0]);
        if((sku && !product) || (!r['Mã đơn'] && !r.code)){ errors++; return; }
        state.orders.push({
          id:uid('ord'), code:String(r['Mã đơn']||r.code), date: r['Ngày']||r.date||todayISO(), platformId:source.id,
          customer:String(r['Khách hàng']||r.customer||''), productId:product?product.id:null, sku:product?product.sku:'',
          qty: parseInt(r['Số lượng']||r.qty||1), sellPrice: parseFloat(r['Giá bán']||r.sellPrice||(product?product.sellPrice:0)),
          discount: parseFloat(r['Giảm giá']||r.discount||0), shippingFeeSeller:0, adsCostAllocated:0,
          kocId:null, campaignId:null, status: r['Trạng thái']||r.status||'success', refundReason:'',
        });
        added++;
      });
      saveData(); render();
      toast(`Import thành công ${added} dòng doanh thu${errors?', bỏ qua '+errors+' dòng lỗi':''}`, errors? 'warning':'success');
    }catch(err){ toast('Lỗi import: '+err.message,'error'); }
  };
  reader.readAsBinaryString(file);
}

function submitProductForm(id){
  const fd = new FormData(document.getElementById('productForm'));
  const sku = fd.get('sku').trim(); const name=fd.get('name').trim();
  if(!sku || !name){ toast('Vui lòng nhập đầy đủ SKU và tên sản phẩm','error'); return; }
  if(!id && state.products.some(p=>p.sku===sku)){ toast('SKU đã tồn tại','error'); return; }
  const platformFeePct = parseFloat(fd.get('platformFeePct')||0);
  if(platformFeePct<0||platformFeePct>100){ toast('Phí sàn phải trong khoảng 0-100%','error'); return; }
  const data = {sku,name,category:fd.get('category'),platformId:fd.get('platformId'),importPrice:parseFloat(fd.get('importPrice')||0),costPrice:parseFloat(fd.get('costPrice')||0),sellPrice:parseFloat(fd.get('sellPrice')||0),platformFeePct,platformManagementFee:parseFloat(fd.get('platformManagementFee')||0),status:fd.get('status')};
  if(data.costPrice<0||data.sellPrice<0){ toast('Giá không được âm','error'); return; }
  if(id){
    const p=getProduct(id); Object.assign(p,data);
  } else {
    const np = Object.assign({id:uid('prod')},data);
    state.products.push(np);
  }
  saveData(); closeModal(); render();
  toast(id?'Cập nhật sản phẩm thành công':'Thêm sản phẩm thành công','success');
}

    state.products = state.products.filter(p=>p.id!==id);
    saveData(); render(); toast('Đã xóa sản phẩm','success');
  });
}

/* ========================================================
   PAGE: BREAK-EVEN
   ======================================================== */
function pageBreakeven(){
  const filters = dateRangeFor('this_month');
  const f2 = {dateFrom:filters.from,dateTo:filters.to,platformId:'all'};
  const orders = filterOrders(state.orders,f2).filter(isCounted);
  const avgSell = safeDiv(orders.reduce((s,o)=>s+o.sellPrice*o.qty,0), orders.reduce((s,o)=>s+o.qty,0))||0;
  let varCostPerOrder=0;
  if(orders.length){ varCostPerOrder = orders.reduce((s,o)=>{const c=calcOrder(o); return s+c.platformFee+c.paymentFee+c.kocCommission+c.adsCost+c.shippingFee+c.cogs;},0)/orders.length; }
  const aov = safeDiv(orders.reduce((s,o)=>s+o.sellPrice*o.qty-o.discount,0), orders.length);
  const fixedCost = state.expenses.filter(e=>!e.isVariable && e.date>=filters.from && e.date<=filters.to).reduce((s,e)=>s+e.amount,0);
  const contributionMargin = aov - varCostPerOrder;
  const breakEvenOrders = safeDiv(fixedCost, contributionMargin);
  const breakEvenRevenue = breakEvenOrders * aov;
  const currentOrders = orders.length;
  const progress = Math.min(100, safeDiv(currentOrders, breakEvenOrders||1)*100);
  return `<div class="page-title">Phân tích Break-Even</div><div class="page-sub">Điểm hòa vốn dựa trên dữ liệu tháng này</div>
  <div class="grid grid-3" style="margin-bottom:16px">
    ${kpiCard({title:'Contribution Margin/đơn',value:contributionMargin,icon:'gauge',grad:'var(--grad-1)',change:0})}
    ${kpiCard({title:'Break-even (số đơn)',value:breakEvenOrders,isCount:true,icon:'orders',grad:'var(--grad-2)',change:0})}
    ${kpiCard({title:'Break-even (doanh thu)',value:breakEvenRevenue,icon:'revenue',grad:'var(--grad-3)',change:0})}
  </div>
  <div class="card">
    <div class="section-title">Tiến độ đạt điểm hòa vốn tháng này</div>
    <div class="progress-outer"><div class="progress-inner" style="width:${progress}%"></div></div>
    <div class="muted" style="margin-top:8px;font-size:12.5px">${formatNumber(currentOrders)} / ${formatNumber(Math.round(breakEvenOrders))} đơn (${progress.toFixed(0)}%)</div>
    <hr class="sep">
    <div class="stat-line"><span class="muted">AOV (giá trị đơn hàng trung bình)</span><b>${formatCurrency(aov)}</b></div>
    <div class="stat-line"><span class="muted">Chi phí biến đổi / đơn</span><b>${formatCurrency(varCostPerOrder)}</b></div>
    <div class="stat-line"><span class="muted">Chi phí cố định tháng này</span><b>${formatCurrency(fixedCost)}</b></div>
  </div>`;
}

afterRenderHooks.koc_overview = function(){
  chartDefaults(); destroyCharts();
  const s=mainState.koc_overview; const range=dateRangeFor(s.preset);
  const filters={dateFrom:range.from,dateTo:range.to,platformId:'all'};
  const km = computeKocMetrics(filters).sort((a,b)=>b.revenue-a.revenue).slice(0,10);
  CHARTS.kr = new Chart(document.getElementById('chartKocRev'),{type:'bar',data:{labels:km.map(m=>m.koc.name.slice(0,12)),datasets:[{label:'Doanh thu',data:km.map(m=>m.revenue),backgroundColor:'#8B5CF6'}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>formatNumber(v)}}}}});
  const kroi = computeKocMetrics(filters).filter(m=>m.orderCount>0).sort((a,b)=>b.roi-a.roi).slice(0,10);
  CHARTS.kroi = new Chart(document.getElementById('chartKocRoi'),{type:'bar',data:{labels:kroi.map(m=>m.koc.name.slice(0,12)),datasets:[{label:'ROI %',data:kroi.map(m=>m.roi),backgroundColor:'#EC4899'}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}});

  CHARTS.kgr = new Chart(document.getElementById('chartKocGroupRev'),{type:'doughnut',data:{labels:state.kocGroups.map(g=>g.name),datasets:[{data:groupRev,backgroundColor:CHART_COLORS}]},options:{plugins:{legend:{position:'bottom'}}}});
  const statusCounts = KOC_STATUSES.map(st=>state.kocs.filter(k=>k.status===st).length);
  CHARTS.kst = new Chart(document.getElementById('chartKocStatus'),{type:'pie',data:{labels:KOC_STATUSES.map(s=>KOC_STATUS_LABEL[s]),datasets:[{data:statusCounts,backgroundColor:CHART_COLORS}]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:9,font:{size:10}}}}}});
};

mainState.koc_list = {group:'all', search:'', selected:[]};
function pageKocList(){
  const s=mainState.koc_list;
  s.selected = Array.isArray(s.selected) ? s.selected.filter(id=>state.kocs.some(k=>k.id===id)) : [];
  const filters = dateRangeForFull();
  const scored = computeKocScore(computeKocMetrics(filters));
  let list = scored.filter(m=>{
    if(s.group!=='all' && m.koc.groupId!==s.group) return false;
    if(s.search){ const q=s.search.toLowerCase(); if(!(m.koc.name.toLowerCase().includes(q)||m.koc.username.toLowerCase().includes(q))) return false; }
    return true;
  });
  const selectedSet=new Set(s.selected);
  const selectedCount=s.selected.length;
  const allVisibleSelected=list.length>0 && list.every(m=>selectedSet.has(m.koc.id));
  return `<div class="page-title">Danh sách KOC</div><div class="page-sub">Quản lý toàn bộ KOC / Affiliate hợp tác</div>
  <div class="filter-row">
    <input class="input" placeholder="Tìm KOC, username..." value="${escapeHtml(s.search)}" oninput="mainState.koc_list.search=this.value;render()">
    <select class="select" onchange="mainState.koc_list.group=this.value;render()">
      <option value="all">Tất cả nhóm</option>
      ${state.kocGroups.map(g=>`<option value="${g.id}" ${s.group===g.id?'selected':''}>${g.name}</option>`).join('')}
    </select>
    <button class="btn" onclick="downloadTemplate('kocs')">${icon('download',14)} Template</button>
    <button class="btn" onclick="exportTableExcel('koc')">${icon('download',14)} Export</button>
    <button class="btn btn-primary" style="margin-left:auto" onclick="openKocModal()">${icon('plus',14)} Thêm KOC</button>
  </div>
  ${selectedCount?`<div class="filter-row" style="padding:10px 12px;border:1px solid var(--border-soft);border-radius:10px;background:var(--card);margin-top:-4px">
    <b style="font-size:12.5px">Đã chọn ${selectedCount} KOC</b>
    <select class="select" id="bulkKocStatus">
      <option value="">Chuyển trạng thái...</option>
      ${KOC_STATUSES.map(st=>`<option value="${st}">${KOC_STATUS_LABEL[st]}</option>`).join('')}
    </select>
    <button class="btn" onclick="bulkUpdateKocStatus()">${icon('check',14)} Áp dụng</button>
    <button class="btn btn-danger" onclick="bulkDeleteKocs()">${icon('trash',14)} Xóa đã chọn</button>
    <button class="btn" onclick="clearKocSelection()">Bỏ chọn</button>
  </div>`:''}
  ${!list.length? emptyState('Chưa có KOC nào','openKocModal()','+ Thêm KOC'):`
  <div class="table-wrap"><table><thead><tr><th style="width:42px;text-align:center"><input type="checkbox" aria-label="Chọn tất cả KOC đang hiển thị" ${allVisibleSelected?'checked':''} onchange="toggleKocSelectAll(this.checked)"></th><th>KOC</th><th>Nền tảng</th><th>Nhóm</th><th>Follower</th><th>Doanh thu</th><th>GMV tháng</th><th>Số video</th><th>Liên hệ</th><th>Score</th><th>Trạng thái</th><th></th></tr></thead><tbody>
  ${list.map(m=>{const k=m.koc; const g=getKocGroup(k.groupId);
    return `<tr>
      <td style="text-align:center"><input type="checkbox" aria-label="Chọn KOC ${escapeHtml(k.name)}" ${selectedSet.has(k.id)?'checked':''} onchange="toggleKocSelection('${k.id}',this.checked)"></td>
      <td><b>${escapeHtml(k.name)}</b><div class="muted" style="font-size:11px">${escapeHtml(k.username)}</div></td>
      <td>${escapeHtml(k.platform)}</td>
      <td><span class="badge b-purple">${g?g.name:'—'}</span></td>
      <td>${formatNumber(k.followers)}</td>
      <td>${formatCurrency(m.revenue)}</td>
      <td>${formatCurrency(k.gmvMonthly||0)}</td>
      <td>${k.videos||0}</td>
      <td>${escapeHtml(k.contact||'—')}</td>
      <td><span class="badge ${m.tierColor}">${m.score} · ${m.tier}</span></td>
      <td><span class="badge b-purple">${KOC_STATUS_LABEL[k.status]}</span></td>
      <td><div class="row-actions"><button onclick="viewKoc('${k.id}')">${icon('eye',14)}</button><button onclick="openKocModal('${k.id}')">${icon('edit',14)}</button><button onclick="deleteKoc('${k.id}')">${icon('trash',14)}</button></div></td>
    </tr>`}).join('')}
  </tbody></table></div>`}
  `;
}
function toggleKocSelection(id,checked){
  const selected=new Set(mainState.koc_list.selected||[]);
  if(checked) selected.add(id); else selected.delete(id);
  mainState.koc_list.selected=[...selected];
  render();
}
function getVisibleKocIds(){
  const s=mainState.koc_list;
  const scored=computeKocScore(computeKocMetrics(dateRangeForFull()));
  return scored.filter(m=>{
    if(s.group!=='all' && m.koc.groupId!==s.group) return false;
    if(s.search){ const q=s.search.toLowerCase(); if(!(m.koc.name.toLowerCase().includes(q)||m.koc.username.toLowerCase().includes(q))) return false; }
    return true;
  }).map(m=>m.koc.id);
}
function toggleKocSelectAll(checked){
  const selected=new Set(mainState.koc_list.selected||[]);
  getVisibleKocIds().forEach(id=>checked?selected.add(id):selected.delete(id));
  mainState.koc_list.selected=[...selected];
  render();
}
function clearKocSelection(){ mainState.koc_list.selected=[]; render(); }
function bulkUpdateKocStatus(){
  const ids=mainState.koc_list.selected||[];
  if(!ids.length){ toast('Vui lòng chọn ít nhất một KOC','warning'); return; }
  const status=document.getElementById('bulkKocStatus')?.value;
  if(!status){ toast('Vui lòng chọn trạng thái cần chuyển','warning'); return; }
  state.kocs.forEach(k=>{ if(ids.includes(k.id)){ k.status=status; k.dateLast=todayISO(); } });
  mainState.koc_list.selected=[];
  saveData(); render();
  toast(`Đã chuyển trạng thái ${ids.length} KOC sang ${KOC_STATUS_LABEL[status]}`,'success');
}
function bulkDeleteKocs(){
  const ids=mainState.koc_list.selected||[];
  if(!ids.length){ toast('Vui lòng chọn ít nhất một KOC','warning'); return; }
  confirmAction(`Xóa ${ids.length} KOC đã chọn? Dữ liệu doanh thu/booking liên quan sẽ giữ nguyên nhưng mất liên kết.`, ()=>{
    const selected=new Set(ids);
    state.kocs=state.kocs.filter(k=>!selected.has(k.id));
    mainState.koc_list.selected=[];
    saveData(); render();
    toast(`Đã xóa ${ids.length} KOC`,'success');
  });
}

function submitKocForm(id){
  const fd = new FormData(document.getElementById('kocForm'));
  const name = fd.get('name').trim(); if(!name){ toast('Vui lòng nhập tên KOC','error'); return; }
  const engagement = parseFloat(fd.get('engagement')||0);
  if(engagement>100||engagement<0){ toast('Engagement phải trong khoảng 0-100%','error'); return; }
  const data = {name,username:fd.get('username'),platform:fd.get('platform'),link:fd.get('link'),groupId:fd.get('groupId'),ownerId:fd.get('ownerId'),status:fd.get('status'),followers:parseInt(fd.get('followers')||0),engagement,videos:parseInt(fd.get('videos')||0),contact:fd.get('contact')||'',gmvMonthly:parseFloat(fd.get('gmvMonthly')||0),dateLast:todayISO()};
  if(id){ Object.assign(getKoc(id),data); } else { state.kocs.push(Object.assign({id:uid('koc')},data)); }
  saveData(); closeModal(); render();
  toast(id?'Cập nhật KOC thành công':'Thêm KOC thành công','success');
}
function deleteKoc(id){
  confirmAction('Xóa KOC này? Các dữ liệu doanh thu/booking liên quan sẽ giữ nguyên nhưng mất liên kết.', ()=>{
    state.kocs = state.kocs.filter(k=>k.id!==id); saveData(); render(); toast('Đã xóa KOC','success');
  });
}
function viewKoc(id){
  const filters = dateRangeForFull();
  const m = computeKocScore(computeKocMetrics(filters)).find(x=>x.koc.id===id);

  const k = m.koc;
  openModal({title:'Chi tiết: '+k.name, bodyHtml:`

function openGroupModal(id){

let dragBookingId = null;
function pageBookings(){
  return `<div class="page-title">Booking KOC</div><div class="page-sub">Pipeline quản lý booking theo trạng thái (kéo thả để chuyển trạng thái)</div>
  <div class="filter-row"><button class="btn btn-primary" onclick="openBookingModal()">${icon('plus',14)} Thêm booking</button></div>
  <div class="kanban">
  ${BOOKING_STATUSES.map(st=>{
    const items = state.bookings.filter(b=>b.status===st);
    return `<div class="kanban-col" data-status="${st}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onBookingDrop(event,'${st}')">
      <h4>${BOOKING_STATUS_LABEL[st]} <span>${items.length}</span></h4>
      ${items.map(b=>{
        const koc=getKoc(b.kocId); const p=getProduct(b.productId);
        const overdue = b.status!=='done'&&b.status!=='cancelled'&&b.deadline<todayISO();
        return `<div class="kanban-card" draggable="true" ondragstart="dragBookingId='${b.id}'" onclick="openBookingModal('${b.id}')">
          <b>${koc?escapeHtml(koc.name):'—'}</b>
          <div class="kc-meta">${p?escapeHtml(p.name):''}</div>
          <div class="kc-meta">Giá: ${formatCurrency(b.priceBooking)} · HH: ${b.commissionPct}%</div>

    </div>`;
  }).join('')}
  </div>`;
}
function onBookingDrop(e,status){
  e.currentTarget.classList.remove('dragover');

  const b = state.bookings.find(x=>x.id===dragBookingId);
  if(b){ b.status=status; saveData(); render(); toast('Đã cập nhật trạng thái booking','success'); }
  dragBookingId=null;
}
function openBookingModal(id){
  const editing = id? state.bookings.find(b=>b.id===id):null;
  const b = editing || {id:null,kocId:state.kocs[0]?.id,productId:state.products[0]?.id,priceBooking:0,commissionPct:10,deadline:addDays(todayISO(),7),status:'lead'};
  if(!state.kocs.length){ toast('Vui lòng thêm KOC trước','warning'); return; }
  openModal({title:editing?'Sửa booking':'Thêm booking', bodyHtml:`

function submitBookingForm(id){
  const fd = new FormData(document.getElementById('bookingForm'));

  if(id){ Object.assign(state.bookings.find(b=>b.id===id),data); } else { state.bookings.push(Object.assign({id:uid('bk')},data)); }

}
function deleteBooking(id){
  confirmAction('Xóa booking này?', ()=>{ state.bookings=state.bookings.filter(b=>b.id!==id); saveData(); closeModal(); render(); toast('Đã xóa booking','success'); });

function pageAds(){
  const ads = state.ads.slice().sort((a,b)=>b.date.localeCompare(a.date));

  const roas = safeDiv(totalRevenue,totalCost); const roi = safeDiv(totalRevenue-totalCost,totalCost)*100;
  const cpc = safeDiv(totalCost,totalClicks); const cpa=safeDiv(totalCost,totalOrders);

    ${kpiCard({title:'CPA',value:cpa,icon:'cac',grad:'var(--grad-2)',change:0,invert:true})}
    ${kpiCard({title:'CTR',value:ctr,isPct:true,icon:'gauge',grad:'var(--grad-3)',change:0})}
    ${kpiCard({title:'CVR',value:cvr,isPct:true,icon:'gauge',grad:'var(--grad-1)',change:0})}

mainState.reports = {tab:'revenue'};
function pageReports(){

    body = `<div class="table-wrap"><table><thead><tr><th>Top</th><th>KOC</th><th>Nhóm</th><th>Doanh thu</th><th>ROI</th><th>Score</th></tr></thead><tbody>${km.slice(0,15).map((m,i)=>{const g=getKocGroup(m.koc.groupId); return `<tr><td>${i+1}</td><td>${escapeHtml(m.koc.name)}</td><td>${g?g.name:''}</td><td>${formatCurrency(m.revenue)}</td><td>${formatPct(m.roi)}</td><td>${m.score}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted" style="text-align:center;padding:20px">Chưa có dữ liệu</td></tr>'}</tbody></table></div>`;
  } else if(s.tab==='platform'){

      const orders = filterOrders(state.orders,{platformId:pl.id}).filter(isCounted);
      let revenue=0,cogs=0,fees=0,profit=0;
      orders.forEach(o=>{const c=calcOrder(o); revenue+=c.netRevenue; cogs+=c.cogs; fees+=c.platformFee+c.paymentFee; profit+=c.netProfit;});

  ${body}`;
}
function exportReportExcel(){
  const s=mainState.reports;
  let rows=[];
  if(s.tab==='product') rows = computeProductMetrics(dateRangeForFull()).map(m=>({'Sản phẩm':m.product.name,'Doanh thu':m.revenue,'Lợi nhuận':m.profit,'Đã bán':m.qty}));

  else { toast('Vui lòng chọn báo cáo Sản phẩm hoặc KOC để export chi tiết','warning'); return; }
  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Report');
  XLSX.writeFile(wb,'bao-cao-'+s.tab+'-'+todayISO()+'.xlsx');
  toast('Export báo cáo thành công','success');
}
