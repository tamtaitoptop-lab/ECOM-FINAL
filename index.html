      <div class="muted" style="margin-bottom:10px;font-size:12px">Tổng trọng số nên bằng 100</div>
      ${Object.entries({revenue:'Doanh thu',orders:'Số đơn',roas:'ROAS',roi:'ROI',engagement:'Engagement',conversion:'Conversion'}).map(([k,l])=>`
      <div class="form-row"><label>${l} (%)</label><input class="input" type="number" min="0" max="100" value="${w[k]}" onchange="updateScoringField('${k}',this.value)"></div>`).join('')}
      <div class="muted" style="font-size:12px">Tổng hiện tại: <b>${Object.values(w).reduce((a,b)=>a+b,0)}%</b></div>
    </div>`;
  } else if(s.tab==='categories'){
    body = `<div class="filter-row"><button class="btn btn-primary" onclick="addCategoryPrompt()">${icon('plus',14)} Thêm danh mục</button></div>
    <div class="table-wrap"><table><thead><tr><th>Danh mục</th><th></th></tr></thead><tbody>
    ${state.categories.map(c=>`<tr><td>${escapeHtml(c.name)}</td><td><div class="row-actions"><button onclick="deleteCategory('${c.id}')">${icon('trash',14)}</button></div></td></tr>`).join('')}
    </tbody></table></div>`;
  } else if(s.tab==='backup'){
    body = `<div class="grid grid-2">
      <div class="card">
        <div class="section-title">${icon('backup',16)} Backup dữ liệu</div>
        <p class="muted" style="font-size:12.5px">Xuất toàn bộ dữ liệu hệ thống ra file JSON để lưu trữ hoặc chuyển sang máy khác.</p>
        <button class="btn btn-primary" onclick="exportBackup()">${icon('download',14)} Backup Data</button>
      </div>
      <div class="card">
        <div class="section-title">${icon('upload',16)} Restore dữ liệu</div>
        <p class="muted" style="font-size:12.5px">Chọn file JSON backup để khôi phục lại toàn bộ dữ liệu.</p>
        <button class="btn" onclick="document.getElementById('restoreFile').click()">${icon('upload',14)} Chọn file</button>
        <input type="file" id="restoreFile" accept=".json" class="hidden" onchange="importBackup(this.files[0])">
      </div>
      <div class="card">
        <div class="section-title" style="color:var(--yellow)">${icon('alert',16)} Xóa dữ liệu demo</div>
        <p class="muted" style="font-size:12.5px">Xóa toàn bộ dữ liệu hiện tại và tạo lại bộ dữ liệu demo mới.</p>
        <button class="btn" style="border-color:var(--yellow);color:var(--yellow)" onclick="confirmResetDemo()">Xóa &amp; Tạo lại Demo</button>
      </div>
      <div class="card">
        <div class="section-title" style="color:var(--red)">${icon('alert',16)} Xóa toàn bộ dữ liệu</div>
        <p class="muted" style="font-size:12.5px">Xóa sạch toàn bộ dữ liệu, đưa hệ thống về trạng thái trống hoàn toàn.</p>
        <button class="btn btn-danger" onclick="confirmClearAll()">Xóa toàn bộ dữ liệu</button>
      </div>
    </div>`;
  } else if(s.tab==='supabase'){
    const cfg = getSupabaseConfig();
    const statusColor = supabaseStatus==='connected'?'var(--green)': supabaseStatus==='connecting'?'var(--yellow)': supabaseStatus==='error'?'var(--red)':'var(--muted)';
    const statusLabel = supabaseStatus==='connected'?'Đã kết nối': supabaseStatus==='connecting'?'Đang kiểm tra...': supabaseStatus==='error'?'Lỗi kết nối':'Chưa kết nối';
    body = `
    <div class="grid grid-2" style="margin-bottom:14px">
      <div class="card">
        <div class="section-title">${icon('backup',16)} Cấu hình Supabase</div>
        <p class="muted" style="font-size:12.5px;margin-bottom:12px">Toàn bộ dữ liệu ECOM DIGITAL sẽ được đồng bộ 2 chiều dưới dạng 1 bản ghi JSON trong bảng <code>${SUPABASE_TABLE}</code> trên Supabase. Trình duyệt vẫn lưu bản sao trong localStorage để dùng offline.</p>
        <div class="form-row"><label>Project URL *</label><input class="input" id="sbUrl" placeholder="https://xxxx.supabase.co" value="${escapeHtml(cfg?.url||'')}"></div>
        <div class="form-row"><label>Anon Public Key *</label><input class="input" id="sbKey" placeholder="eyJhbGciOi..." value="${escapeHtml(cfg?.anonKey||'')}"></div>
        <div class="form-row"><label>Mã cửa hàng (Store ID)</label><input class="input" id="sbStoreId" placeholder="default" value="${escapeHtml(cfg?.storeId||'default')}"></div>
        <div class="form-row" style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="sbAutoSync" ${cfg?.autoSync?'checked':''} style="width:16px;height:16px">
          <label style="margin:0" for="sbAutoSync">Tự động đồng bộ lên Supabase mỗi khi có thay đổi</label>
        </div>
        <div class="row-actions" style="margin-top:6px">
          <button class="btn btn-primary" onclick="saveSupabaseSettingsForm()">${icon('save',14)} Lưu &amp; Kết nối</button>
          ${cfg? `<button class="btn btn-danger" onclick="disconnectSupabase()">${icon('x',14)} Ngắt kết nối</button>`:''}
        </div>
      </div>
      <div class="card">
        <div class="section-title">Trạng thái kết nối</div>
        <div class="stat-line"><span class="muted">Trạng thái</span><b style="color:${statusColor}">● ${statusLabel}</b></div>
        <div class="stat-line"><span class="muted">Bảng dữ liệu</span><b>${SUPABASE_TABLE}</b></div>
        <div class="stat-line"><span class="muted">Mã cửa hàng</span><b>${escapeHtml(cfg?.storeId||'default')}</b></div>
        ${supabaseStatusMsg? `<div class="muted" style="color:var(--red);font-size:11.5px;margin-top:6px">${escapeHtml(supabaseStatusMsg)}</div>`:''}
        <hr class="sep">
        <div class="row-actions">
          <button class="btn" onclick="testSupabaseConnection().then(render)">${icon('check',14)} Kiểm tra kết nối</button>
          <button class="btn btn-primary" onclick="pushStateToSupabase(false)">${icon('upload',14)} Đồng bộ lên Supabase</button>
        </div>
        <div class="row-actions" style="margin-top:8px">
          <button class="btn" onclick="confirmPullFromSupabase()">${icon('download',14)} Tải dữ liệu từ Supabase</button>
        </div>
        <p class="muted" style="font-size:11px;margin-top:10px">Lưu ý: "Tải dữ liệu từ Supabase" sẽ ghi đè toàn bộ dữ liệu hiện tại trên trình duyệt này.</p>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="section-title">Bước 1: Tạo bảng trên Supabase ${icon('info',15)}</div>
      <p class="muted" style="font-size:12.5px">Mở Project trên supabase.com → SQL Editor → dán đoạn SQL dưới đây và chạy (chỉ cần làm 1 lần):</p>
      <textarea class="input" id="sbSqlBox" readonly style="width:100%;min-height:180px;font-family:monospace;font-size:11.5px;white-space:pre">${escapeHtml(SUPABASE_SQL)}</textarea>
      <button class="btn" style="margin-top:8px" onclick="copySupabaseSql()">${icon('download',14)} Copy SQL</button>
    </div>
    <div class="card">
      <div class="section-title" style="color:var(--yellow)">${icon('alert',16)} Lưu ý bảo mật</div>
      <p class="muted" style="font-size:12.5px;line-height:1.6">
        App chạy hoàn toàn trên trình duyệt (không có backend riêng) nên Anon Key sẽ hiển thị công khai trong mã nguồn phía client.
        Đoạn SQL ở trên bật quyền đọc/ghi công khai (RLS cho phép <code>true</code>) để app hoạt động được ngay, nghĩa là bất kỳ ai
        có Project URL + Anon Key + đúng "Mã cửa hàng" đều có thể đọc/ghi dữ liệu này. Khuyến nghị:
      </p>
      <ul style="font-size:12.5px;color:var(--muted);line-height:1.8;padding-left:18px">
        <li>Đặt "Mã cửa hàng" là một chuỗi khó đoán (không dùng "default" khi dùng thật)</li>
        <li>Không lưu dữ liệu quá nhạy cảm (thông tin thẻ, mật khẩu, CCCD...) trong hệ thống này</li>
        <li>Nếu cần bảo mật cao hơn, nên bổ sung Supabase Auth + RLS theo user thay vì policy mở công khai</li>
      </ul>
    </div>`;
  }
  return `<div class="page-title">Cài đặt</div><div class="page-sub">Cấu hình hệ thống ECOM DIGITAL</div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="tab-btn ${s.tab===k?'active':''}" onclick="mainState.settings.tab='${k}';render()">${l}</button>`).join('')}</div>
  ${body}`;
}
function saveBusinessSettings(){
  state.settings.business.name = document.getElementById('bizName').value;
  state.settings.business.email = document.getElementById('bizEmail').value;
  state.settings.business.phone = document.getElementById('bizPhone').value;
  saveData(); toast('Đã lưu cài đặt doanh nghiệp','success'); render();
}
function updatePlatformField(i,field,val){
  state.platforms[i][field] = parseFloat(val)||0;
  saveData(); toast('Đã cập nhật cài đặt sàn','success');
}
function updateScoringField(key,val){
  const v = parseFloat(val); if(v<0||v>100){ toast('Trọng số phải từ 0-100','error'); render(); return; }
  state.settings.kocScoring[key]=v; saveData(); toast('Đã cập nhật trọng số scoring','success'); render();
}
function addCategoryPrompt(){
  openModal({title:'Thêm danh mục', bodyHtml:`<div class="form-row"><label>Tên danh mục *</label><input class="input" id="newCatName"></div>`, footerHtml:`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="submitNewCategory()">Lưu</button>`});
}
function submitNewCategory(){
  const name = document.getElementById('newCatName').value.trim();
  if(!name){ toast('Vui lòng nhập tên danh mục','error'); return; }
  state.categories.push({id:uid('cat'),name}); saveData(); closeModal(); render(); toast('Đã thêm danh mục','success');
}
function deleteCategory(id){
  if(state.products.some(p=>p.category===id)){ toast('Không thể xóa danh mục đang có sản phẩm','warning'); return; }
  confirmAction('Xóa danh mục này?', ()=>{ state.categories=state.categories.filter(c=>c.id!==id); saveData(); render(); toast('Đã xóa danh mục','success'); });
}
function confirmResetDemo(){
  confirmAction('Toàn bộ dữ liệu hiện tại sẽ bị xóa và thay bằng dữ liệu demo mới. Tiếp tục?', ()=>{
    resetData(); toast('Đã tạo lại dữ liệu demo','success'); navigate('dashboard');
  });
}
function confirmClearAll(){
  confirmAction('Toàn bộ dữ liệu sẽ bị xóa vĩnh viễn (không thể hoàn tác). Bạn có chắc chắn?', ()=>{
    clearAllData(); toast('Đã xóa toàn bộ dữ liệu','success'); navigate('dashboard');
  });
}

/* ---------------- PAGE MAP ---------------- */
const PAGES = {
  dashboard:pageDashboard, orders:pageOrders, products:pageProducts, revenue:pageRevenue, refunds:pageRefunds,
  finance:pageFinance, expenses:pageExpenses, profit:pageProfit, settlement:pageSettlement, cashflow:pageCashflow, breakeven:pageBreakeven,
  koc_overview:pageKocOverview, koc_list:pageKocList, koc_group:pageKocGroup, campaigns:pageCampaigns, bookings:pageBookings,
  ads:pageAds, reports:pageReports, settings:pageSettings,
};

/* ---------------- INIT ---------------- */
async function init(){
  const loaded = loadData();
  if(!loaded){
    state = defaultState();
    generateDemoData();
    saveData();
  }
  const hashRoute = window.location.hash.replace('#','');
  currentRoute = PAGES[hashRoute] ? hashRoute : 'dashboard';
  render();
  // Nếu đã cấu hình Supabase, thử tải dữ liệu mới nhất từ cloud (không chặn render ban đầu)
  const cfg = getSupabaseConfig();
  if(cfg){
    initSupabaseClient();
    const got = await pullStateFromSupabase(true);
    if(got) render();
    else testSupabaseConnection().then(()=>{ if(mainState.settings && mainState.settings.tab==='supabase') render(); });
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
